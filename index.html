<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Resource Finder</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .chat {
      background: white;
      border-radius: 12px;
      padding: 20px;
    }

    h1 {
      margin-top: 0;
    }

    #messages {
      min-height: 300px;
      padding: 10px 0;
    }

    .message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
    }

    .bot {
      background: #eeeeee;
    }

    .user {
      background: #dceeff;
      text-align: right;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="chat">

    <h1>Support Resource Finder</h1>

    <p>
      Tell me what kind of support you're looking for.
    </p>

    <div id="messages">
      <div class="message bot">
        Hi! I can help you find support resources. What do you need help with?
      </div>
    </div>

    <form id="chat-form" class="input-area">
      <input
        id="user-input"
        type="text"
        placeholder="e.g. I need help with transportation"
        required
      >

      <button type="submit">Send</button>
    </form>

  </div>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("user-input");
    const messages = document.getElementById("messages");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const userText = input.value.trim();

      if (!userText) {
        return;
      }

      // Show user's message
      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = userText;
      messages.appendChild(userMessage);

      // Temporary response
      const botMessage = document.createElement("div");
      botMessage.className = "message bot";
      botMessage.textContent =
        "Thanks! Once we connect the resource list, I'll use it to find relevant support.";
      messages.appendChild(botMessage);

      input.value = "";
      input.focus();
    });
  </script>

</body>
</html>
