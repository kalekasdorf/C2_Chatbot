<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Support Resource Finder</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f7;
      color: #222;
    }

    header {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 30px 20px;
    }

    header .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      margin: 0 0 8px 0;
    }

    header p {
      margin: 0;
      color: #666;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .filters {
      background: white;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #ddd;
      margin-bottom: 25px;
    }

    .filter-row {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
    }

    .search-box label,
    .service-filter label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 16px;
      background: white;
    }

    .service-filter {
      width: 250px;
    }

    .results-header {
      margin-bottom: 15px;
      color: #555;
    }

    .resource {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .resource h2 {
      margin: 0 0 6px 0;
      font-size: 20px;
    }

    .service-type {
      display: inline-block;
      background: #eeeeee;
      padding: 5px 9px;
      border-radius: 5px;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .resource p {
      line-height: 1.5;
      margin: 8px 0;
    }

    .contact {
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid #eee;
    }

    .contact a {
      margin-right: 20px;
    }

    a {
      color: #1769aa;
    }

    .no-results {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 10px;
      border: 1px solid #ddd;
      color: #666;
    }

    @media (max-width: 600px) {

      .service-filter {
        width: 100%;
      }

      main {
        padding: 0 12px;
      }

    }

  </style>
</head>


<body>

  <header>

    <div class="container">

      <h1>Support Resource Finder</h1>

      <p>
        Search and browse available support resources.
      </p>

    </div>

  </header>


  <main>

    <section class="filters">

      <div class="filter-row">

        <div class="search-box">

          <label for="search">
            Search
          </label>

          <input
            type="text"
            id="search"
            placeholder="Search by organization, service, or keyword..."
          >

        </div>


        <div class="service-filter">

          <label for="service">
            Type of Service
          </label>

          <select id="service">

            <option value="">
              All Services
            </option>

          </select>

        </div>

      </div>

    </section>


    <div class="results-header">

      <strong id="result-count">
        0 resources found
      </strong>

    </div>


    <section id="results"></section>

  </main>


  <script>

    /*
      DUMMY DATA ONLY

      These are fictional examples.
      We will eventually replace these with
      your actual spreadsheet data.
    */

    const resources = [

      {
        type: "Food & Groceries",

        organization: "Example Community Food Support",

        contact: "Alex Smith",

        address: "123 Example Street, Victoria, BC",

        website: "https://example.com",

        phone: "250-555-0101",

        email: "example@example.com",

        details:
          "Provides food and grocery support to community members."
      },


      {
        type: "Transportation",

        organization: "Example Community Transportation",

        contact: "Jordan Lee",

        address: "456 Example Avenue, Victoria, BC",

        website: "https://example.com",

        phone: "250-555-0102",

        email: "transport@example.com",

        details:
          "Provides transportation assistance for appointments and essential errands."
      },


      {
        type: "Social Connection",

        organization: "Example Social Connection Centre",

        contact: "Taylor Brown",

        address: "789 Example Road, Victoria, BC",

        website: "https://example.com",

        phone: "250-555-0103",

        email: "social@example.com",

        details:
          "Offers activities and opportunities to connect with other community members."
      },


      {
        type: "Technology Help",

        organization: "Example Technology Help",

        contact: "Morgan Wilson",

        address: "100 Example Boulevard, Victoria, BC",

        website: "https://example.com",

        phone: "250-555-0104",

        email: "tech@example.com",

        details:
          "Provides basic assistance with computers, phones, tablets, and other technology."
      },


      {
        type: "Housing",

        organization: "Example Housing Support",

        contact: "Jamie Taylor",

        address: "200 Example Street, Victoria, BC",

        website: "https://example.com",

        phone: "250-555-0105",

        email: "housing@example.com",

        details:
          "Provides information and support related to housing."
      }

    ];


    const searchInput =
      document.getElementById("search");

    const serviceSelect =
      document.getElementById("service");

    const results =
      document.getElementById("results");

    const resultCount =
      document.getElementById("result-count");


    /*
      Create the service filter options
    */

    const serviceTypes =
      [...new Set(
        resources.map(resource => resource.type)
      )];


    serviceTypes.forEach(type => {

      const option =
        document.createElement("option");

      option.value = type;

      option.textContent = type;

      serviceSelect.appendChild(option);

    });


    /*
      Display resources
    */

    function displayResources() {

      const search =
        searchInput.value.toLowerCase().trim();

      const selectedService =
        serviceSelect.value;


      const filtered =
        resources.filter(resource => {

          const searchableText = (

            resource.type + " " +
            resource.organization + " " +
            resource.contact + " " +
            resource.address + " " +
            resource.details

          ).toLowerCase();


          const matchesSearch =
            searchableText.includes(search);


          const matchesService =
            selectedService === "" ||
            resource.type === selectedService;


          return matchesSearch && matchesService;

        });


      results.innerHTML = "";


      resultCount.textContent =
        `${filtered.length} resource${
          filtered.length === 1 ? "" : "s"
        } found`;


      if (filtered.length === 0) {

        results.innerHTML = `

          <div class="no-results">

            <h2>No resources found</h2>

            <p>
              Try a different search term or service type.
            </p>

          </div>

        `;

        return;

      }


      filtered.forEach(resource => {

        const card =
          document.createElement("article");

        card.className = "resource";


        card.innerHTML = `

          <h2>
            ${resource.organization}
          </h2>

          <div class="service-type">
            ${resource.type}
          </div>

          <p>
            ${resource.details}
          </p>

          <div class="contact">

            ${
              resource.address
                ? `<p>📍 ${resource.address}</p>`
                : ""
            }

            ${
              resource.phone
                ? `<a href="tel:${resource.phone}">
                    ☎ ${resource.phone}
                  </a>`
                : ""
            }

            ${
              resource.email
                ? `<a href="mailto:${resource.email}">
                    ✉ ${resource.email}
                  </a>`
                : ""
            }

            ${
              resource.website
                ? `<a
                    href="${resource.website}"
                    target="_blank"
                    rel="noopener noreferrer">
                    🌐 Website
                  </a>`
                : ""
            }

          </div>

        `;


        results.appendChild(card);

      });

    }


    /*
      Update results whenever the user searches
      or changes the service filter.
    */

    searchInput.addEventListener(
      "input",
      displayResources
    );


    serviceSelect.addEventListener(
      "change",
      displayResources
    );


    /*
      Show everything when the page loads.
    */

    displayResources();

  </script>

</body>

</html>
