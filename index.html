<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Resource Finder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .filters {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    input,
    select,
    button {
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    input:focus,
    select:focus {
      outline: 2px solid #8ab4f8;
      border-color: #5b8def;
    }

    button {
      background: #555;
      color: white;
      border: none;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover {
      background: #333;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .result-count {
      color: #666;
      font-size: 14px;
    }

    .results {
      display: grid;
      gap: 15px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .service-type {
      display: inline-block;
      background: #eef2f7;
      padding: 5px 9px;
      border-radius: 5px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .card p {
      margin: 7px 0;
      line-height: 1.5;
    }

    .card a {
      color: #1769aa;
      text-decoration: none;
    }

    .card a:hover {
      text-decoration: underline;
    }

    .no-results {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 10px;
      color: #666;
    }

    @media (max-width: 850px) {
      .filter-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 550px) {
      .filter-grid {
        grid-template-columns: 1fr;
      }

      .results-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 5px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Support Resource Finder</h1>

    <p class="subtitle">
      Find community resources and support services using the filters below.
    </p>

    <div class="filters">

      <div class="filter-grid">

        <div class="filter-group">
          <label for="search">Search</label>
          <input
            type="text"
            id="search"
            placeholder="Search by keyword, organization, address..."
          >
        </div>

        <div class="filter-group">
          <label for="typeFilter">Type of Service</label>
          <select id="typeFilter">
            <option value="">All services</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="locationFilter">Location</label>
          <select id="locationFilter">
            <option value="">All locations</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="organizationFilter">Organization</label>
          <select id="organizationFilter">
            <option value="">All organizations</option>
          </select>
        </div>

        <button id="clearFilters">Clear Filters</button>

      </div>

    </div>

    <div class="results-header">
      <strong>Resources</strong>
      <span class="result-count" id="resultCount"></span>
    </div>

    <div class="results" id="results"></div>

  </div>

  <script>

    /*
      Dummy resources for testing.
      Later, we can replace this with your actual spreadsheet data.
    */

    const resources = [

      {
        type: "Food Support",
        organization: "Example Community Food Support",
        contact: "Jane Smith",
        address: "123 Main Street, Victoria",
        website: "https://example.com",
        phone: "250-555-1000",
        email: "info@example.com",
        details: "Provides food hampers and grocery support to community members."
      },

      {
        type: "Transportation",
        organization: "Example Community Transportation",
        contact: "John Doe",
        address: "456 Douglas Street, Victoria",
        website: "https://example.com",
        phone: "250-555-2000",
        email: "transport@example.com",
        details: "Transportation assistance for appointments and community activities."
      },

      {
        type: "Social Connection",
        organization: "Example Social Connection Centre",
        contact: "Mary Jones",
        address: "789 Oak Avenue, Saanich",
        website: "https://example.com",
        phone: "250-555-3000",
        email: "contact@example.com",
        details: "Social programs, activities and opportunities to connect with others."
      },

      {
        type: "Technology Help",
        organization: "Example Technology Help",
        contact: "Alex Brown",
        address: "321 Government Street, Victoria",
        website: "https://example.com",
        phone: "250-555-4000",
        email: "help@example.com",
        details: "Help with computers, phones, internet access and basic technology."
      },

      {
        type: "Housing Support",
        organization: "Example Housing Support",
        contact: "Sam Wilson",
        address: "555 Cedar Road, Esquimalt",
        website: "https://example.com",
        phone: "250-555-5000",
        email: "housing@example.com",
        details: "Information and assistance related to housing and finding accommodation."
      }

    ];


    const searchInput = document.getElementById("search");
    const typeFilter = document.getElementById("typeFilter");
    const locationFilter = document.getElementById("locationFilter");
    const organizationFilter = document.getElementById("organizationFilter");
    const clearFiltersButton = document.getElementById("clearFilters");
    const resultsContainer = document.getElementById("results");
    const resultCount = document.getElementById("resultCount");


    /*
      Get unique values from the resource list
      and use them to populate the dropdowns.
    */

    function populateFilters() {

      const types = [...new Set(resources.map(resource => resource.type))]
        .sort();

      const locations = [...new Set(
        resources.map(resource => getLocation(resource.address))
      )].sort();

      const organizations = [...new Set(
        resources.map(resource => resource.organization)
      )].sort();


      types.forEach(type => {
        const option = document.createElement("option");
        option.value = type;
        option.textContent = type;
        typeFilter.appendChild(option);
      });


      locations.forEach(location => {
        const option = document.createElement("option");
        option.value = location;
        option.textContent = location;
        locationFilter.appendChild(option);
      });


      organizations.forEach(organization => {
        const option = document.createElement("option");
        option.value = organization;
        option.textContent = organization;
        organizationFilter.appendChild(option);
      });

    }


    /*
      Gets the location from the end of the address.
      For now our dummy addresses use:
      "Street Address, City"
    */

    function getLocation(address) {

      if (!address) {
        return "";
      }

      const parts = address.split(",");

      return parts[parts.length - 1].trim();

    }


    /*
      Filter the resources whenever the user changes
      any of the controls.
    */

    function filterResources() {

      const searchTerm = searchInput.value.toLowerCase().trim();
      const selectedType = typeFilter.value;
      const selectedLocation = locationFilter.value;
      const selectedOrganization = organizationFilter.value;


      const filteredResources = resources.filter(resource => {

        const searchableText = [

          resource.type,
          resource.organization,
          resource.contact,
          resource.address,
          resource.details

        ].join(" ").toLowerCase();


        const matchesSearch =
          !searchTerm ||
          searchableText.includes(searchTerm);


        const matchesType =
          !selectedType ||
          resource.type === selectedType;


        const matchesLocation =
          !selectedLocation ||
          getLocation(resource.address) === selectedLocation;


        const matchesOrganization =
          !selectedOrganization ||
          resource.organization === selectedOrganization;


        return (
          matchesSearch &&
          matchesType &&
          matchesLocation &&
          matchesOrganization
        );

      });


      displayResults(filteredResources);

    }


    /*
      Display the matching resources.
    */

    function displayResults(resourceList) {

      resultsContainer.innerHTML = "";

      resultCount.textContent =
        `${resourceList.length} resource${resourceList.length === 1 ? "" : "s"} found`;


      if (resourceList.length === 0) {

        resultsContainer.innerHTML = `
          <div class="no-results">
            <strong>No resources found.</strong>
            <p>Try removing one or more filters or using a different search term.</p>
          </div>
        `;

        return;
      }


      resourceList.forEach(resource => {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `

          <h2>${resource.organization}</h2>

          <span class="service-type">
            ${resource.type}
          </span>

          <p>
            <strong>Contact:</strong>
            ${resource.contact}
          </p>

          <p>
            <strong>Location:</strong>
            ${resource.address}
          </p>

          <p>
            <strong>Phone:</strong>
            <a href="tel:${resource.phone}">
              ${resource.phone}
            </a>
          </p>

          <p>
            <strong>Email:</strong>
            <a href="mailto:${resource.email}">
              ${resource.email}
            </a>
          </p>

          <p>
            <strong>Website:</strong>
            <a href="${resource.website}" target="_blank">
              Visit website
            </a>
          </p>

          <p>
            <strong>Details:</strong>
            ${resource.details}
          </p>

        `;

        resultsContainer.appendChild(card);

      });

    }


    /*
      Clear all filters.
    */

    clearFiltersButton.addEventListener("click", () => {

      searchInput.value = "";
      typeFilter.value = "";
      locationFilter.value = "";
      organizationFilter.value = "";

      filterResources();

    });


    /*
      Update results whenever a filter changes.
    */

    searchInput.addEventListener("input", filterResources);

    typeFilter.addEventListener("change", filterResources);

    locationFilter.addEventListener("change", filterResources);

    organizationFilter.addEventListener("change", filterResources);


    /*
      Start the page.
    */

    populateFilters();

    displayResults(resources);

  </script>

</body>
</html>
