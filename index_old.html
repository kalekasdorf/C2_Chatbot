<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Resource Finder</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .chat {
      background: white;
      border-radius: 12px;
      padding: 20px;
    }

    h1 {
      margin-top: 0;
    }

    #messages {
      min-height: 300px;
      padding: 10px 0;
    }

    .message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
    }

    .bot {
      background: #eeeeee;
    }

    .user {
      background: #dceeff;
      text-align: right;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="chat">

    <h1>Support Resource Finder</h1>

    <p>
      Tell me what kind of support you're looking for.
    </p>

    <div id="messages">
      <div class="message bot">
        Hi! I can help you find support resources. What do you need help with?
      </div>
    </div>

    <form id="chat-form" class="input-area">
      <input
        id="user-input"
        type="text"
        placeholder="e.g. I need help with transportation"
        required
      >

      <button type="submit">Send</button>
    </form>

  </div>

  <script src="resources.js"></script>
  
  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("user-input");
    const messages = document.getElementById("messages");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const userText = input.value.trim();

      if (!userText) {
        return;
      }

      // Show user's message
      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = userText;
      messages.appendChild(userMessage);

      // Temporary response
      // Look for relevant resources
      const searchText = userText.toLowerCase();
      
      const matches = resources.filter(function(resource) {
        const searchableText =
          resource.type + " " +
          resource.name + " " +
          resource.details;
      
        return searchableText.toLowerCase().includes(searchText);
      });
      
      const botMessage = document.createElement("div");
      botMessage.className = "message bot";
      
      if (matches.length > 0) {
      
        botMessage.textContent = "I found these potentially relevant resources:";
      
        matches.forEach(function(resource) {
      
          const resourceDiv = document.createElement("div");
      
          resourceDiv.innerHTML = `
            <h3>${resource.name}</h3>
            <p>${resource.details}</p>
            <p>Phone: ${resource.phone}</p>
            <p><a href="${resource.website}" target="_blank">Website</a></p>
          `;
      
          botMessage.appendChild(resourceDiv);
        });
      
      } else {
      
        botMessage.textContent =
          "I couldn't find a resource that matches your request in the available resource list.";
      
      }
      
      messages.appendChild(botMessage);
      

      input.value = "";
      input.focus();
    });
  </script>

</body>
</html>
